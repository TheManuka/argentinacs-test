name: Publicar sitio

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Publica la rama main de cada repo:
    # - acesino25/argentinacs-landing -> www.argentinacs.com.ar (sitio en vivo)
    # - TheManuka/argentinacs-test    -> subdominio de testeo (espejo de la rama test)
    if: github.ref == 'refs/heads/main' && (github.repository == 'acesino25/argentinacs-landing' || github.repository == 'TheManuka/argentinacs-test')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Bajar el contenido
        uses: actions/checkout@v4

      - name: Preparar el sitio (sin archivos internos)
        run: |
          mkdir salida
          rsync -a --exclude '.git' --exclude '.github' --exclude 'salida' \
            --exclude 'tools' --exclude 'README.md' \
            --exclude '.gitattributes' --exclude '.gitignore' \
            ./ salida/
          if [ "$GITHUB_REPOSITORY" = "TheManuka/argentinacs-test" ]; then
            rm -f salida/CNAME
            printf 'User-agent: *\nDisallow: /\n' > salida/robots.txt
          fi

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: salida

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
