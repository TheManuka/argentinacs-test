name: Actualizar datos de servidores

on:
  schedule:
    # minutos "impares" para esquivar la congestion del scheduler de GitHub
    # (los crons en minutos redondos se retrasan mucho mas)
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  scrape:
    # Por ahora corre en el espejo de test; cuando el repo principal tenga
    # Pages activo, cambiar el guard y DATOS_URL en servidor.html
    if: github.repository == 'TheManuka/argentinacs-test'
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el contenido
        uses: actions/checkout@v4

      - name: Bajar datos de GameTracker
        run: python3 tools/scrape_gt.py

      - name: Publicar rama datos
        run: |
          cd datos
          git init -b datos
          git config user.name "argentinacs-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Datos de GameTracker actualizados"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
